<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#14532D" />
  <title>Portal Estate — PT Rebinmas Jaya</title>

  <!-- Fonts: Sora display · Inter body · Roboto Mono numeric -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
</head>

<body>
  <div id="root">
    <style>
      .initial-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background-color: #e8f1ea;
        font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }

      .spinner {
        width: 50px;
        height: 50px;
        border: 4px solid #cfe3d3;
        border-top: 4px solid #1e7a45;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 1rem;
      }

      .loading-text {
        font-size: 1.125rem;
        color: #14532d;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
    <div class="initial-loader">
      <div class="spinner"></div>
      <div class="loading-text">Portal Estate — Memuat...</div>
      <div style="font-size: 0.875rem; color: #2a4638; margin-top: 0.5rem;">Sistem Monitoring & Pelaporan PT Rebinmas Jaya</div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
