<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payroll Reporting System - PT Rebinmas</title>
</head>

<body>
  <div id="root">
    <style>
      .initial-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background-color: #f3f4f6;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }

      .spinner {
        width: 50px;
        height: 50px;
        border: 4px solid #d1d5db;
        border-top: 4px solid #2563eb;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 1rem;
      }

      .loading-text {
        font-size: 1.125rem;
        color: #374151;
        font-weight: 500;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }

        100% {
          transform: rotate(360deg);
        }
      }
    </style>
    <div class="initial-loader">
      <div class="spinner"></div>
      <div class="loading-text">Memuat Aplikasi Payroll...</div>
      <div style="font-size: 0.875rem; color: #6b7280; margin-top: 0.5rem;">Sistem Monitoring & Pelaporan</div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
